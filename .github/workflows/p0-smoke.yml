name: p0-smoke

on:
  push:
    paths: ["p0/**", ".github/workflows/p0-smoke.yml"]
  pull_request:
    paths: ["p0/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: P0 skeleton smoke (vector gen + verifier self-test)
        run: cd p0 && make smoke
